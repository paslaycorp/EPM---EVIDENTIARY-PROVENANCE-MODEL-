name: IH-TNL Research Harness

on:
  pull_request:
    paths:
      - "experiments/ih_tnl/**"
      - "tests/test_ih_tnl_benchmark.py"
      - ".github/workflows/ih-tnl.yml"
  push:
    branches: ["main"]
    paths:
      - "experiments/ih_tnl/**"
      - "tests/test_ih_tnl_benchmark.py"
      - ".github/workflows/ih-tnl.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest==8.3.5
      - name: Prove executable benchmark behavior
        run: python -m pytest -q tests/test_ih_tnl_benchmark.py
      - name: Prove stimulus generation is deterministic and executable
        run: |
          python -m experiments.ih_tnl.runner emit > /tmp/ih-tnl-a.json
          python -m experiments.ih_tnl.runner emit > /tmp/ih-tnl-b.json
          cmp /tmp/ih-tnl-a.json /tmp/ih-tnl-b.json
