name: EPM Runtime CI

on:
  push:
    branches:
      - main
      - 'vnext/**'
      - 'rc/**'
      - 'postrelease/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install build
      - name: Lint EPM runtime
        run: ruff check src/epm
      - name: Lint public reference examples
        run: ruff check examples
      - name: Lint external validation tools
        run: ruff check tools
      - name: Lint certification tests for correctness
        run: ruff check --select F tests
      - name: Compile runtime examples and validation tools
        run: python -m compileall -q src/epm examples tools
      - name: Import public package
        run: python -c "import epm; print(epm.EPM_ENGINE_VERSION)"
      - name: Execute public reference examples
        run: |
          python examples/basic_transition.py
          python examples/temporal_availability.py
          python examples/future_effective_rule.py
          python examples/legal_secondary_use.py
          python examples/legal_chain_of_custody.py
      - name: Run Blackbox Gauntlet
        run: |
          python tools/epm_gauntlet.py --output /tmp/epm-validation-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/epm-validation-receipt.json').read_text())
          assert receipt['result'] == 'PASS'
          assert receipt['failed_cases'] == 0
          assert receipt['total_cases'] >= 12
          PY
      - name: Certification suite
        run: pytest -q
      - name: Build distribution
        run: python -m build
