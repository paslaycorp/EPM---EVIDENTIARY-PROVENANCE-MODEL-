name: EPM Supply Chain Proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, tag, branch, or SHA to package and attest"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-and-attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      target_ref: ${{ steps.package.outputs.target_ref }}
      target_sha: ${{ steps.package.outputs.target_sha }}
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}

    steps:
      - name: Resolve target ref
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Manual release proof must execute from refs/heads/main"
              exit 1
            fi
            ref="${{ inputs.ref }}"
          else
            ref="${GITHUB_REF_NAME}"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"

      - name: Install pinned build toolchain
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib.metadata as metadata
          import sys

          expected_python = (3, 12, 14)
          actual_python = sys.version_info[:3]
          assert actual_python == expected_python, (
              f"Python drift: expected {expected_python}, got {actual_python}"
          )

          expected_pip = "26.2.1"
          actual_pip = metadata.version("pip")
          assert actual_pip == expected_pip, (
              f"pip drift: expected {expected_pip}, got {actual_pip}"
          )
          PY

          python -m pip install --no-deps             "packaging==26.3"             "pyproject_hooks==1.3.3"             "build==1.6.1"             "setuptools==84.0.0"             "wheel==0.48.0"

          python - <<'PY'
          import importlib.metadata as metadata

          expected = {
              "build": "1.6.1",
              "packaging": "26.3",
              "pyproject-hooks": "1.3.3",
              "setuptools": "84.0.0",
              "wheel": "0.48.0",
          }
          for package, version in expected.items():
              actual = metadata.version(package)
              assert actual == version, (
                  f"Toolchain drift for {package}: expected {version}, got {actual}"
              )
              print(f"{package}=={actual}")
          PY

      - name: Verify package identity
        id: package
        env:
          TARGET_REF: ${{ steps.target.outputs.ref }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          data = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project = data["project"]
          name = project["name"]
          version = project["version"]
          target_ref = os.environ["TARGET_REF"]
          target_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          target_epoch = subprocess.check_output(
              ["git", "show", "-s", "--format=%ct", "HEAD"], text=True
          ).strip()

          assert name == "epm-evidentiary-provenance-model"

          tag_exists = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{target_ref}"],
              check=False,
          ).returncode == 0

          if tag_exists:
              expected_tag = f"v{version}"
              assert target_ref == expected_tag, (
                  f"Release tag {target_ref!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"name={name}", file=output)
              print(f"version={version}", file=output)
              print(f"target_ref={target_ref}", file=output)
              print(f"target_sha={target_sha}", file=output)
              print(f"target_epoch={target_epoch}", file=output)

          print(f"{name}=={version}")
          print(f"target_ref={target_ref}")
          print(f"target_sha={target_sha}")
          print(f"target_epoch={target_epoch}")
          PY

      - name: Build with pinned toolchain
        env:
          SOURCE_DATE_EPOCH: ${{ steps.package.outputs.target_epoch }}
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build --no-isolation

      - name: Generate resolved CycloneDX SBOM
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import pathlib
          import platform
          import tomllib

          pyproject = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project = pyproject["project"]
          runtime_dependencies = project.get("dependencies") or []

          if runtime_dependencies:
              raise SystemExit(
                  "Refusing to emit an incomplete SBOM: runtime dependencies "
                  "exist but have not been resolved by this release-proof workflow."
              )

          name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          root_purl = f"pkg:pypi/{name}@{version}"

          tool_versions = {
              "pip": metadata.version("pip"),
              "build": metadata.version("build"),
              "packaging": metadata.version("packaging"),
              "pyproject-hooks": metadata.version("pyproject-hooks"),
              "setuptools": metadata.version("setuptools"),
              "wheel": metadata.version("wheel"),
          }

          tools = [
              {
                  "type": "application",
                  "name": "Python",
                  "version": platform.python_version(),
                  "purl": f"pkg:generic/python@{platform.python_version()}",
              }
          ]
          for tool_name, tool_version in sorted(tool_versions.items()):
              tools.append(
                  {
                      "type": "application",
                      "name": tool_name,
                      "version": tool_version,
                      "purl": f"pkg:pypi/{tool_name}@{tool_version}",
                  }
              )

          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "library",
                      "bom-ref": root_purl,
                      "name": name,
                      "version": version,
                      "purl": root_purl,
                      "properties": [
                          {
                              "name": "epm:runtime-dependency-count",
                              "value": "0",
                          }
                      ],
                  },
                  "tools": {"components": tools},
              },
              "components": [],
              "dependencies": [
                  {
                      "ref": root_purl,
                      "dependsOn": [],
                  }
              ],
          }

          pathlib.Path(f"dist/epm-v{version}.cdx.json").write_text(
              json.dumps(bom, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate EPM release evidence receipt
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          TARGET_REF: ${{ steps.package.outputs.target_ref }}
          TARGET_SHA: ${{ steps.package.outputs.target_sha }}
          TARGET_EPOCH: ${{ steps.package.outputs.target_epoch }}
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata as metadata
          import json
          import os
          import pathlib
          import platform

          dist = pathlib.Path("dist")
          wheel = list(dist.glob("*.whl"))
          sdist = list(dist.glob("*.tar.gz"))
          sbom = list(dist.glob("*.cdx.json"))

          assert len(wheel) == 1, f"Expected one wheel, found {len(wheel)}"
          assert len(sdist) == 1, f"Expected one sdist, found {len(sdist)}"
          assert len(sbom) == 1, f"Expected one SBOM, found {len(sbom)}"

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          subjects = []
          for path in (wheel[0], sdist[0], sbom[0]):
              subjects.append(
                  {
                      "path": path.name,
                      "sha256": digest(path),
                      "size": path.stat().st_size,
                  }
              )

          toolchain = {
              "python": platform.python_version(),
              "pip": metadata.version("pip"),
              "build": metadata.version("build"),
              "packaging": metadata.version("packaging"),
              "pyproject-hooks": metadata.version("pyproject-hooks"),
              "setuptools": metadata.version("setuptools"),
              "wheel": metadata.version("wheel"),
          }

          receipt = {
              "schema": "epm.release-evidence/v1",
              "package": {
                  "name": os.environ["PACKAGE_NAME"],
                  "version": os.environ["PACKAGE_VERSION"],
              },
              "target": {
                  "ref": os.environ["TARGET_REF"],
                  "sha": os.environ["TARGET_SHA"],
                  "source_date_epoch": int(os.environ["TARGET_EPOCH"]),
              },
              "workflow": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "path": ".github/workflows/supply-chain.yml",
                  "ref": os.environ["GITHUB_REF"],
                  "sha": os.environ["GITHUB_SHA"],
                  "event": os.environ["GITHUB_EVENT_NAME"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
              "runner": {
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
                  "image_os": os.environ.get("ImageOS"),
                  "image_version": os.environ.get("ImageVersion"),
                  "platform": platform.platform(),
              },
              "toolchain": toolchain,
              "artifacts": subjects,
              "sbom": {
                  "path": sbom[0].name,
                  "sha256": digest(sbom[0]),
                  "format": "CycloneDX",
                  "spec_version": "1.6",
                  "runtime_dependency_count": 0,
              },
              "policy": {
                  "id": "EPM-SCP-V2",
                  "provenance_is_not_authorization": True,
                  "manual_dispatch_requires_main": True,
                  "runtime_dependencies_must_be_fully_resolved": True,
              },
          }

          pathlib.Path("dist/EPM-RELEASE-EVIDENCE.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum             *.whl             *.tar.gz             *.cdx.json             EPM-RELEASE-EVIDENCE.json             | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Upload package proof bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epm-supply-chain-${{ steps.package.outputs.target_ref }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

  verify-proof:
    needs: package-and-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download proof bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: epm-supply-chain-${{ needs.package-and-attest.outputs.target_ref }}
          path: proof/

      - name: Verify hashes and EPM evidence contract
        env:
          EXPECTED_TARGET_REF: ${{ needs.package-and-attest.outputs.target_ref }}
          EXPECTED_TARGET_SHA: ${{ needs.package-and-attest.outputs.target_sha }}
          EXPECTED_PACKAGE_NAME: ${{ needs.package-and-attest.outputs.package_name }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.package-and-attest.outputs.package_version }}
        run: |
          set -euo pipefail
          cd proof
          sha256sum -c SHA256SUMS

          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(".")
          receipt = json.loads(
              pathlib.Path("EPM-RELEASE-EVIDENCE.json").read_text(encoding="utf-8")
          )

          assert receipt["schema"] == "epm.release-evidence/v1"
          assert receipt["policy"]["id"] == "EPM-SCP-V2"
          assert receipt["policy"]["provenance_is_not_authorization"] is True

          assert receipt["target"]["ref"] == os.environ["EXPECTED_TARGET_REF"]
          assert receipt["target"]["sha"] == os.environ["EXPECTED_TARGET_SHA"]
          assert receipt["package"]["name"] == os.environ["EXPECTED_PACKAGE_NAME"]
          assert receipt["package"]["version"] == os.environ["EXPECTED_PACKAGE_VERSION"]

          assert receipt["workflow"]["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["workflow"]["ref"] == os.environ["GITHUB_REF"]
          assert receipt["workflow"]["sha"] == os.environ["GITHUB_SHA"]
          assert receipt["workflow"]["run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert receipt["workflow"]["run_attempt"] == int(os.environ["GITHUB_RUN_ATTEMPT"])

          expected_toolchain = {
              "python": "3.12.14",
              "pip": "26.2.1",
              "build": "1.6.1",
              "packaging": "26.3",
              "pyproject-hooks": "1.3.3",
              "setuptools": "84.0.0",
              "wheel": "0.48.0",
          }
          assert receipt["toolchain"] == expected_toolchain

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          artifact_names = set()
          for subject in receipt["artifacts"]:
              path = root / subject["path"]
              assert path.is_file(), f"Missing artifact {path}"
              assert digest(path) == subject["sha256"]
              assert path.stat().st_size == subject["size"]
              artifact_names.add(path.name)

          sbom_path = root / receipt["sbom"]["path"]
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))
          assert receipt["sbom"]["sha256"] == digest(sbom_path)
          assert receipt["sbom"]["runtime_dependency_count"] == 0
          assert sbom["bomFormat"] == "CycloneDX"
          assert sbom["specVersion"] == "1.6"
          component = sbom["metadata"]["component"]
          assert component["name"] == os.environ["EXPECTED_PACKAGE_NAME"]
          assert component["version"] == os.environ["EXPECTED_PACKAGE_VERSION"]
          assert sbom["components"] == []
          assert sbom["dependencies"] == [
              {
                  "ref": component["bom-ref"],
                  "dependsOn": [],
              }
          ]

          manifest_entries = {}
          for line in pathlib.Path("SHA256SUMS").read_text(encoding="utf-8").splitlines():
              value, name = line.split(maxsplit=1)
              manifest_entries[name] = value

          expected_manifest_names = artifact_names | {"EPM-RELEASE-EVIDENCE.json"}
          assert set(manifest_entries) == expected_manifest_names
          assert manifest_entries["EPM-RELEASE-EVIDENCE.json"] == digest(
              pathlib.Path("EPM-RELEASE-EVIDENCE.json")
          )

          print("EPM-SCP-V2 local verification PASS")
          PY

      - name: Verify GitHub and Sigstore attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          signer="${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml"

          for file in proof/*; do
            [[ -f "$file" ]] || continue

            verified=0
            for attempt in 1 2 3 4; do
              if gh attestation verify "$file"                 --repo "$GITHUB_REPOSITORY"                 --signer-workflow "$signer"                 --source-digest "$GITHUB_SHA"                 --source-ref "$GITHUB_REF"                 --deny-self-hosted-runners; then
                verified=1
                break
              fi

              sleep $((attempt * 3))
            done

            if [[ "$verified" -ne 1 ]]; then
              echo "::error::Attestation verification failed for $file"
              exit 1
            fi
          done

      - name: Emit verification receipt
        env:
          VERIFIED_TARGET_REF: ${{ needs.package-and-attest.outputs.target_ref }}
          VERIFIED_TARGET_SHA: ${{ needs.package-and-attest.outputs.target_sha }}
        run: |
          mkdir -p verification

          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          proof = pathlib.Path("proof")

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          subjects = []
          for path in sorted(p for p in proof.iterdir() if p.is_file()):
              subjects.append(
                  {
                      "path": path.name,
                      "sha256": digest(path),
                      "size": path.stat().st_size,
                  }
              )

          gh_version = subprocess.check_output(
              ["gh", "--version"], text=True
          ).splitlines()[0]

          result = {
              "schema": "epm.release-verification/v1",
              "policy": "EPM-SCP-V2",
              "result": "PASS",
              "target": {
                  "ref": os.environ["VERIFIED_TARGET_REF"],
                  "sha": os.environ["VERIFIED_TARGET_SHA"],
              },
              "workflow": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "ref": os.environ["GITHUB_REF"],
                  "sha": os.environ["GITHUB_SHA"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
              "verifier": {
                  "github_cli": gh_version,
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
                  "deny_self_hosted_runners": True,
              },
              "verified_subjects": subjects,
          }

          pathlib.Path("verification/EPM-VERIFICATION-RESULT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epm-verification-${{ needs.package-and-attest.outputs.target_ref }}
          path: verification/
          if-no-files-found: error
          retention-days: 90

      - name: Attest verification receipt
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "verification/EPM-VERIFICATION-RESULT.json"
