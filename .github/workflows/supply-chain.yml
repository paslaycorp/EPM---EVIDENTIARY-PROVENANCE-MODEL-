name: EPM Supply Chain Proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, tag, branch, or SHA to package and attest"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.ref }}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Verify package identity
        id: package
        env:
          TARGET_REF: ${{ steps.target.outputs.ref }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          data = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project = data["project"]
          name = project["name"]
          version = project["version"]
          target_ref = os.environ["TARGET_REF"]

          assert name == "epm-evidentiary-provenance-model"

          tag_exists = subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{target_ref}"],
              check=False,
          ).returncode == 0

          if tag_exists:
              expected_tag = f"v{version}"
              assert target_ref == expected_tag, (
                  f"Release tag {target_ref!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"name={name}", file=output)
              print(f"version={version}", file=output)

          print(f"{name}=={version}")
          print(f"target_ref={target_ref}")
          print(f"target_sha={subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Generate CycloneDX SBOM
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          purl = f"pkg:pypi/{name}@{version}"

          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "library",
                      "bom-ref": purl,
                      "name": name,
                      "version": version,
                      "purl": purl,
                  }
              },
              "components": [],
          }

          Path(f"dist/epm-v{version}.cdx.json").write_text(
              json.dumps(bom, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Upload package proof bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epm-supply-chain-${{ steps.target.outputs.ref }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
